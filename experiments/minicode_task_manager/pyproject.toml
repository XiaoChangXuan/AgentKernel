[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-task-manager-challenge"
version = "0.1.0"
description = "Deterministic MiniCode workload fixture for AgentKernel runtime observation."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
task-manager = "task_manager.cli:main"

[tool.setuptools.packages.find]
include = ["task_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
